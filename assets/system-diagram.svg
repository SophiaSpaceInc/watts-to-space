<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 716" width="1100" height="716" role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">Three parts, three handoffs: how the heat-rejection model splits</title>
  <desc id="sd-desc">The model has three nearly independent parts. The heat path takes the heat source, its temperature limit, the power per package and the coolant loop, and computes the coolant temperature reaching the radiator. The radiator takes emissivity, solar absorptance, fin efficiency, orientation, sizing margin and areal density, applies Stefan–Boltzmann net of what it sees, and computes heat rejected per square metre and so the radiator area. The power supply takes cell efficiency, operating factor, solar array areal density, bus voltage, battery specific energy and depth of discharge, and computes the solar array area and battery mass. Only three quantities cross between parts: the coolant temperature T from the heat path into the radiator; the heat load Q (total heat load divided by conversion efficiency) into both the radiator and the power supply; and the location (orbit or surface, altitude, beta angle, ground temperature, sun elevation, sunlit fraction) into both the radiator and the power supply. The radiator area, solar array area and battery feed a results block: mass budget, solar array to radiator area ratio, and sensitivity.</desc>

  <!-- Theme: light tokens by default, dark via prefers-color-scheme. Chart series colours are deliberately absent. -->
  <style>
    svg {
      --surface: #fffffe;
      --surface-2: #f0efea;
      --ink: #15140f;
      --ink-2: #514f49;
      --muted: #86847c;
      --border: rgba(21, 20, 15, 0.14);
      --accent: #3b4d8e;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --surface: #171716;
        --surface-2: #202020;
        --ink: #f0efea;
        --ink-2: #bfbdb4;
        --muted: #8a887f;
        --border: rgba(255, 255, 255, 0.13);
        --accent: #a4b3ee;
      }
    }
    /* boxes */
    .part    { fill: var(--surface);   stroke: var(--border); stroke-width: 1; }
    .results { fill: var(--surface-2); stroke: var(--ink-2);  stroke-width: 1; stroke-opacity: 0.7; }
    .pill    { fill: var(--surface);   stroke: var(--accent); stroke-width: 1.5; }
    /* text */
    .serif   { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Charter, Georgia, serif; }
    .h0      { font-size: 30px; fill: var(--ink); }
    .h1      { font-size: 22px; fill: var(--ink); }
    .lede    { font-size: 17px; fill: var(--ink-2); }
    .sub     { fill: var(--muted); font-style: italic; }
    .credit  { font-size: 12px; fill: var(--ink-2); }
    .lbl     { fill: var(--muted); font-style: italic; }
    .body    { fill: var(--ink-2); }
    .out     { fill: var(--ink); font-weight: 600; }
    .pill-t  { fill: var(--accent); font-size: 16px; font-weight: 600; text-anchor: middle; }
    .cap     { fill: var(--muted); text-anchor: middle; }
    .flow-t  { fill: var(--ink-2); }
    /* lines */
    .handoff { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .flow    { stroke: var(--ink-2);  stroke-width: 1.5; fill: none; }
    .mk-accent { fill: var(--accent); }
    .mk-ink    { fill: var(--ink-2); }
  </style>

  <defs>
    <marker id="ah-accent" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk-accent" d="M0 1 L10 5 L0 9 Z"/>
    </marker>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk-ink" d="M0 1 L10 5 L0 9 Z"/>
    </marker>
  </defs>

  <!-- ============ Title block and legend (top right) ============ -->
  <g id="title-block">
    <text class="serif h0" x="500" y="76">Three parts, three handoffs</text>
    <text class="lede" x="500" y="108">Each part has its own knobs. Three quantities, the pills,</text>
    <text class="lede" x="500" y="131">carry its outputs to the others. The results combine all three.</text>
    <!-- legend -->
    <rect class="part" x="500" y="169" width="30" height="18"/>
    <text class="body" x="544" y="183">Part: its own knobs, physics and charts</text>
    <rect class="pill" x="500" y="195" width="30" height="18" rx="9"/>
    <text class="body" x="544" y="209">Handoff: one of three quantities that cross between parts</text>
    <rect class="results" x="500" y="221" width="30" height="18"/>
    <text class="body" x="544" y="235">Results: everything combined</text>
  </g>

  <!-- ============ Part 1: Heat path (x 40–440) ============ -->
  <g id="heat-path">
    <rect class="part" x="40" y="36" width="400" height="206"/>
    <text class="serif h1" x="56" y="66">1 · Heat path</text>
    <text class="sub" x="424" y="66" text-anchor="end">chip to coolant</text>
    <text class="lbl" x="56" y="96">Knobs</text>
    <text class="body" x="136" y="96">heat source type · source temperature
      <tspan x="136" dy="20">limit (e.g. chip junction 373 K) ·</tspan>
      <tspan x="136" dy="20">power per package · coolant loop: coolant,</tspan>
      <tspan x="136" dy="20">transport, heat exchanger, coolant rise</tspan></text>
    <text class="lbl" x="56" y="180">Computes</text>
    <text class="out" x="136" y="180">coolant temperature at the radiator</text>
    <text class="lbl" x="56" y="204">Charts</text>
    <text class="body" x="136" y="204">The temperature staircase ·
      <tspan x="136" dy="20">Electricity vs heat over distance</tspan></text>
  </g>

  <!-- ============ Handoff: coolant temperature T (heat path → radiator) ============ -->
  <g id="handoff-T">
    <line class="handoff" x1="240" y1="242" x2="240" y2="314" marker-end="url(#ah-accent)"/>
    <rect class="pill" x="145" y="262" width="190" height="32" rx="16"/>
    <text class="pill-t" x="240" y="283">Coolant temperature T</text>
  </g>

  <!-- ============ Part 2: Radiator (x 40–440) ============ -->
  <g id="radiator">
    <rect class="part" x="40" y="314" width="400" height="232"/>
    <text class="serif h1" x="56" y="344">2 · Radiator</text>
    <text class="sub" x="424" y="344" text-anchor="end">coolant to space</text>
    <text class="lbl" x="56" y="374">Knobs</text>
    <text class="body" x="136" y="374">emissivity ε · solar absorptance α ·
      <tspan x="136" dy="20">fin efficiency η · orientation ·</tspan>
      <tspan x="136" dy="20">sizing margin · areal density</tspan></text>
    <text class="lbl" x="56" y="438">Physics</text>
    <text class="body" x="136" y="438">Stefan–Boltzmann, net of what the
      <tspan x="136" dy="20">radiator sees: Earth, Moon, sunlit ground</tspan></text>
    <text class="lbl" x="56" y="482">Computes</text>
    <text class="out" x="136" y="482">heat rejected per m² → radiator area</text>
    <text class="lbl" x="56" y="506">Charts</text>
    <text class="body" x="136" y="506">Radiator design curves ·
      <tspan x="136" dy="20">Planet-view penalty vs altitude</tspan></text>
  </g>

  <!-- ============ Part 3: Power supply (x 660–1060) ============ -->
  <g id="power-supply">
    <rect class="part" x="660" y="314" width="400" height="232"/>
    <text class="serif h1" x="676" y="344">3 · Power supply</text>
    <text class="sub" x="1044" y="344" text-anchor="end">sunlight to bus</text>
    <text class="lbl" x="676" y="374">Knobs</text>
    <text class="body" x="756" y="374">cell efficiency · operating factor ·
      <tspan x="756" dy="20">solar array areal density · bus voltage ·</tspan>
      <tspan x="756" dy="20">battery specific energy · discharge depth</tspan></text>
    <text class="lbl" x="676" y="438">Physics</text>
    <text class="body" x="756" y="438">orbit-average power balance: sunlight sizes
      <tspan x="756" dy="20">the solar array, eclipse sizes the battery</tspan></text>
    <text class="lbl" x="676" y="482">Computes</text>
    <text class="out" x="756" y="482">solar array area · battery mass</text>
    <text class="lbl" x="676" y="506">Chart</text>
    <text class="body" x="756" y="506">Power-supply mass vs sunlit fraction</text>
  </g>

  <!-- ============ Handoffs: heat load Q and location (zone x 440–660, into both lower parts) ============ -->
  <g id="handoff-Q">
    <line class="handoff" x1="475" y1="352" x2="440" y2="352" marker-end="url(#ah-accent)"/>
    <line class="handoff" x1="625" y1="352" x2="660" y2="352" marker-end="url(#ah-accent)"/>
    <rect class="pill" x="475" y="336" width="150" height="32" rx="16"/>
    <text class="pill-t" x="550" y="357">Heat load Q</text>
    <text class="cap" x="550" y="388">total heat load ÷
      <tspan x="550" dy="20">conversion efficiency:</tspan>
      <tspan x="550" dy="20">every watt ends as heat</tspan></text>
  </g>
  <g id="handoff-location">
    <line class="handoff" x1="475" y1="466" x2="440" y2="466" marker-end="url(#ah-accent)"/>
    <line class="handoff" x1="625" y1="466" x2="660" y2="466" marker-end="url(#ah-accent)"/>
    <rect class="pill" x="475" y="450" width="150" height="32" rx="16"/>
    <text class="pill-t" x="550" y="471">Location</text>
    <text class="cap" x="550" y="502">orbit or surface, altitude,
      <tspan x="550" dy="20">β angle, ground temperature,</tspan>
      <tspan x="550" dy="20">sun elevation, sunlit fraction</tspan></text>
  </g>

  <!-- ============ Flows into results ============ -->
  <g id="flows-to-results">
    <line class="flow" x1="240" y1="546" x2="240" y2="594" marker-end="url(#ah-ink)"/>
    <text class="flow-t" x="252" y="575">radiator area</text>
    <line class="flow" x1="860" y1="546" x2="860" y2="594" marker-end="url(#ah-ink)"/>
    <text class="flow-t" x="848" y="575" text-anchor="end">solar array area, battery mass</text>
  </g>

  <!-- ============ Results (sink) ============ -->
  <g id="results">
    <rect class="results" x="40" y="594" width="1020" height="84"/>
    <text class="serif h1" x="56" y="626">Results</text>
    <text class="sub" x="56" y="652">all three parts combined</text>
    <text class="lbl" x="330" y="626">Reports</text>
    <text class="out" x="410" y="626">mass budget · solar array : radiator area ratio · sensitivity</text>
    <text class="lbl" x="330" y="652">Charts</text>
    <text class="body" x="410" y="652">Run hotter · Mass budget · Sensitivity slopes</text>
  </g>

  <!-- ============ Credit (CC BY 4.0: keep when reproducing) ============ -->
  <text class="credit" x="1060" y="704" text-anchor="end">Chris Lewicki · watts-to-space · CC BY 4.0</text>
</svg>
